<div class="min-h-screen bg-gradient-to-br from-navy via-navy/95 to-navy/90 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-block logo-chip px-5 py-3 mb-5">
        <img src="assets/logo.png" alt="Yoon u Auto" class="h-12 w-auto" loading="eager">
      </a>
      <h1 class="font-heading text-2xl font-bold text-frost">Bon retour</h1>
      <p class="text-frost/60 mt-1 text-sm">Connectez-vous à votre compte</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl p-8 shadow-2xl">

      @if (error()) {
        <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm" role="alert">
          {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <!-- Identifiant : téléphone ou e-mail -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-navy mb-1.5" for="identifier">
            Téléphone
          </label>
          <input
            id="identifier"
            type="text"
            formControlName="identifier"
            autocomplete="username"
            inputmode="tel"
            class="w-full px-4 py-3 rounded-lg border border-navy/20 focus:border-azure focus:ring-2 focus:ring-azure/20 outline-none transition-colors text-navy placeholder-navy/40"
            placeholder="+221 77 123 45 67"
          >
          @if (form.get('identifier')?.invalid && form.get('identifier')?.touched) {
            <p class="text-red-500 text-xs mt-1">Saisissez votre numéro de téléphone.</p>
          } @else {
            <p class="text-navy/50 text-xs mt-1">Vous pouvez aussi utiliser votre adresse e-mail.</p>
          }
        </div>

        <!-- Mot de passe -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-navy mb-1.5" for="password">
            Mot de passe
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            class="w-full px-4 py-3 rounded-lg border border-navy/20 focus:border-azure focus:ring-2 focus:ring-azure/20 outline-none transition-colors text-navy placeholder-navy/40"
            placeholder="••••••••"
          >
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full btn-azure py-3 text-base font-semibold"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="flex items-center justify-center gap-2">
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
              </svg>
              Connexion…
            </span>
          } @else {
            Se connecter
          }
        </button>
      </form>

      <p class="text-center text-navy/60 text-sm mt-6">
        Pas encore de compte&nbsp;?
        <a routerLink="/auth/register" queryParamsHandling="preserve" class="text-azure font-medium hover:underline">Créer un compte</a>
      </p>
    </div>

  </div>
</div>
