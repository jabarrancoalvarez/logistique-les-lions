services:
  - type: web
    name: logistique-les-lions-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: logistique-les-lions-api
      - key: Jwt__Audience
        value: logistique-les-lions-client
      - key: Jwt__AccessTokenExpirationMinutes
        value: "15"
      - key: Jwt__RefreshTokenExpirationDays
        value: "30"
      - key: Cors__AllowedOrigins
        sync: false
      - key: Frontend__Url
        sync: false
      # El disco de Render es efímero: en producción los archivos van a Cloudflare R2.
      # Mientras Storage__Provider siga en «local», se escriben en disco y se pierden
      # en cada reinicio.
      # ⚠️ Cambiar a «r2» SOLO cuando el bucket y las cuatro claves de abajo estén
      # puestas. Con «local» los archivos se pierden en cada reinicio.
      - key: Storage__Provider
        value: local
      - key: Storage__LocalPath
        value: /app/uploads
      - key: Storage__Bucket
        sync: false
      - key: Storage__ServiceUrl
        sync: false
      - key: Storage__AccessKey
        sync: false
      - key: Storage__SecretKey
        sync: false
      # URL pública del bucket, solo para el prefijo public/
      - key: Storage__PublicBaseUrl
        sync: false
