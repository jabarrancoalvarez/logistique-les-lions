services:
  - type: web
    # ⚠️ El nombre no manda sobre la URL. Al renombrar el servicio el 16/08/2026, Render
    # conservó su hostname original: la API sigue respondiendo en
    # logistique-les-lions-api.onrender.com y así queda apuntada en
    # environment.production.ts. No es un descuido —cambiarlo exigiría recrear el
    # servicio y migrar a mano todas las variables de abajo— y no la ve nadie: solo la
    # llama el frontend. Con un dominio propio se resuelve añadiendo un dominio
    # personalizado al servicio.
    name: yoon-u-auto-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: yoon-u-auto-api
      - key: Jwt__Audience
        value: yoon-u-auto-client
      - key: Jwt__AccessTokenExpirationMinutes
        value: "15"
      - key: Jwt__RefreshTokenExpirationDays
        value: "30"
      - key: Cors__AllowedOrigins
        sync: false
      - key: Frontend__Url
        sync: false
      # El disco de Render es efímero: en producción los archivos van a Cloudflare R2.
      # Mientras Storage__Provider siga en «local», se escriben en disco y se pierden
      # en cada reinicio.
      # ⚠️ Cambiar a «r2» SOLO cuando el bucket y las cuatro claves de abajo estén
      # puestas. Con «local» los archivos se pierden en cada reinicio.
      - key: Storage__Provider
        value: local
      - key: Storage__LocalPath
        value: /app/uploads
      - key: Storage__Bucket
        sync: false
      - key: Storage__ServiceUrl
        sync: false
      - key: Storage__AccessKey
        sync: false
      - key: Storage__SecretKey
        sync: false
      # URL pública del bucket, solo para el prefijo public/
      - key: Storage__PublicBaseUrl
        sync: false
