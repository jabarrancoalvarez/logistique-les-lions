services:
  - type: web
    # ⚠️ El nombre no manda sobre la URL. Al renombrar el servicio el 16/08/2026, Render
    # conservó su hostname original: la API sigue respondiendo en
    # logistique-les-lions-api.onrender.com y así queda apuntada en
    # environment.production.ts. No es un descuido —cambiarlo exigiría recrear el
    # servicio y migrar a mano todas las variables de abajo— y no la ve nadie: solo la
    # llama el frontend. Con un dominio propio se resuelve añadiendo un dominio
    # personalizado al servicio.
    name: yoon-u-auto-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: yoon-u-auto-api
      - key: Jwt__Audience
        value: yoon-u-auto-client
      - key: Jwt__AccessTokenExpirationMinutes
        value: "15"
      - key: Jwt__RefreshTokenExpirationDays
        value: "30"
      - key: Cors__AllowedOrigins
        sync: false
      - key: Frontend__Url
        sync: false
      # El disco de Render es efímero: lo escrito en «local» se pierde en cada reinicio.
      # Para la demo usamos «database»: los archivos que suben los usuarios (fotos de
      # anuncio, documentos de Mon Garage) se guardan en Neon y sobreviven a los
      # despliegues sin ningún servicio externo. Es una tabla `stored_files` con los bytes.
      # Las fotos del catálogo sembrado no dependen de esto: son estáticos del frontend.
      #
      # ⚠️ Con un catálogo grande esto comparte espacio con los datos y sirve las imágenes
      # más despacio que un CDN. Cuando llegue ese momento, se pasa a «r2» rellenando el
      # bucket y las cuatro claves de abajo: el resto de la app no cambia.
      - key: Storage__Provider
        value: database
      - key: Storage__LocalPath
        value: /app/uploads
      - key: Storage__Bucket
        sync: false
      - key: Storage__ServiceUrl
        sync: false
      - key: Storage__AccessKey
        sync: false
      - key: Storage__SecretKey
        sync: false
      # URL pública del bucket, solo para el prefijo public/
      - key: Storage__PublicBaseUrl
        sync: false
